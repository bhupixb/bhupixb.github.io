<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1400" height="788" viewBox="0 0 1400 788">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
    <radialGradient id="redglow" cx="0.82" cy="0.7" r="0.45">
      <stop offset="0" stop-color="#f85149" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f85149" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberglow" cx="0.12" cy="0.72" r="0.35">
      <stop offset="0" stop-color="#e3b341" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e3b341" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="errglow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#f85149" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="788" fill="url(#bg)"/>
  <rect width="1400" height="788" fill="url(#dots)"/>
  <rect width="1400" height="788" fill="url(#amberglow)"/>
  <rect width="1400" height="788" fill="url(#redglow)"/>

  <!-- Giant faint null -->
  <text x="1330" y="330" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="270" font-weight="700" fill="#ffffff" fill-opacity="0.045" letter-spacing="-8">null</text>

  <!-- Title block -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="80" y="92" width="250" height="34" rx="17" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.5"/>
    <circle cx="102" cy="109" r="5" fill="#f85149"/>
    <text x="116" y="115" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#ff7b72" letter-spacing="2">INCIDENT · JUL 2025</text>

    <text x="78" y="222" font-size="76" font-weight="800" fill="#f0f6fc" letter-spacing="-2">A null pointer</text>
    <text x="78" y="306" font-size="76" font-weight="800" fill="#f0f6fc" letter-spacing="-2">from an <tspan fill="#e3b341">old token</tspan></text>
    <text x="82" y="358" font-size="24" fill="#8b949e">My first production incident, and why none of us could reproduce it.</text>
  </g>

  <!-- Card 1: localStorage token -->
  <g filter="url(#shadow)">
    <rect x="80" y="430" width="360" height="250" rx="16" fill="#161b22" stroke="#30363d"/>
  </g>
  <circle cx="106" cy="455" r="6" fill="#ff5f57"/>
  <circle cx="126" cy="455" r="6" fill="#febc2e"/>
  <circle cx="146" cy="455" r="6" fill="#28c840"/>
  <text x="168" y="461" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#8b949e">localStorage</text>
  <rect x="340" y="443" width="80" height="24" rx="12" fill="#e3b341" fill-opacity="0.14" stroke="#e3b341" stroke-opacity="0.6"/>
  <text x="380" y="460" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#e3b341" letter-spacing="1">EXPIRED</text>
  <line x1="80" y1="480" x2="440" y2="480" stroke="#30363d"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="20">
    <text x="104" y="518" fill="#c9d1d9">{</text>
    <text x="128" y="552" fill="#c9d1d9"><tspan fill="#79c0ff">"userId"</tspan>: <tspan fill="#a5d6ff">"user-123"</tspan>,</text>
    <rect x="116" y="563" width="300" height="34" rx="6" fill="#f85149" fill-opacity="0.08" stroke="#f85149" stroke-dasharray="6 5"/>
    <text x="128" y="586" fill="#f85149" fill-opacity="0.85">"accountId": ???</text>
    <text x="128" y="622" fill="#c9d1d9"><tspan fill="#79c0ff">"exp"</tspan>: <tspan fill="#ffa657">1751400000</tspan></text>
    <text x="104" y="656" fill="#c9d1d9">}</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="450" y1="555" x2="508" y2="555" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Card 2: interceptor -->
  <g filter="url(#shadow)">
    <rect x="520" y="430" width="380" height="250" rx="16" fill="#161b22" stroke="#30363d"/>
  </g>
  <rect x="544" y="447" width="16" height="16" rx="4" fill="none" stroke="#d2a8ff" stroke-width="2"/>
  <line x1="552" y1="443" x2="552" y2="467" stroke="#d2a8ff" stroke-width="2"/>
  <text x="572" y="461" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#d2a8ff">Interceptor</text>
  <rect x="756" y="443" width="124" height="24" rx="12" fill="#d2a8ff" fill-opacity="0.12" stroke="#d2a8ff" stroke-opacity="0.5"/>
  <text x="818" y="460" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#d2a8ff" letter-spacing="1">EVERY REQUEST</text>
  <line x1="520" y1="480" x2="900" y2="480" stroke="#30363d"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="20">
    <text x="544" y="518" fill="#6e7681">// runs before auth</text>
    <text x="544" y="556" fill="#c9d1d9">claims</text>
    <text x="568" y="590" fill="#c9d1d9">.get(<tspan fill="#a5d6ff">"accountId"</tspan>)</text>
    <text x="568" y="624" fill="#c9d1d9">.<tspan fill="#d2a8ff">toString</tspan>();</text>
    <path d="M580,634 q6,-6 12,0 t12,0 t12,0 t12,0 t12,0 t12,0 t12,0 t12,0 t12,0 t12,0 t12,0" fill="none" stroke="#f85149" stroke-width="2.2"/>
    <text x="568" y="664" font-size="15" fill="#f85149" fill-opacity="0.8">null.toString() 💥</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="910" y1="555" x2="968" y2="555" stroke="#f85149" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrowRed)"/>

  <!-- Card 3: error -->
  <g filter="url(#errglow)">
    <rect x="980" y="430" width="340" height="250" rx="16" fill="#1c0f12" stroke="#f85149" stroke-opacity="0.8"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="1004" y="528" font-size="72" font-weight="800" fill="#f85149" letter-spacing="-2">500</text>
    <text x="1004" y="570" font-size="22" font-weight="600" fill="#f0f6fc">Unexpected error occurred</text>
  </g>
  <line x1="1004" y1="594" x2="1296" y2="594" stroke="#f85149" stroke-opacity="0.3"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15">
    <text x="1004" y="628" fill="#ff7b72">java.lang.NullPointerException</text>
    <text x="1004" y="654" fill="#8b949e">  at Interceptor.preHandle(…)</text>
  </g>

  <!-- Footer -->
  <text x="80" y="738" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681">An expired token, still sitting in local storage, took down every API.</text>
</svg>
