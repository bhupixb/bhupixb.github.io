<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
    <radialGradient id="greenglow" cx="0.82" cy="0.7" r="0.45">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueglow" cx="0.12" cy="0.72" r="0.35">
      <stop offset="0" stop-color="#79c0ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#79c0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="okglow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#3fb950" flood-opacity="0.40"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="788" fill="url(#bg)"/>
  <rect width="1400" height="788" fill="url(#dots)"/>
  <rect width="1400" height="788" fill="url(#blueglow)"/>
  <rect width="1400" height="788" fill="url(#greenglow)"/>

  <!-- Giant faint word -->
  <text x="1330" y="330" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="230" font-weight="700" fill="#ffffff" fill-opacity="0.03" letter-spacing="-8">tmpfs</text>

  <!-- Title block -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="80" y="92" width="272" height="34" rx="17" fill="#79c0ff" fill-opacity="0.10" stroke="#79c0ff" stroke-opacity="0.45"/>
    <circle cx="102" cy="109" r="5" fill="#79c0ff"/>
    <text x="116" y="115" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#79c0ff" letter-spacing="2">POSTGRES · TESTING</text>

    <text x="78" y="222" font-size="76" font-weight="800" fill="#f0f6fc" letter-spacing="-2">Mount your test Postgres</text>
    <text x="78" y="306" font-size="76" font-weight="800" fill="#f0f6fc" letter-spacing="-2">on <tspan fill="#3fb950">RAM</tspan></text>
    <text x="82" y="358" font-size="24" fill="#8b949e">One Testcontainers line, and a much faster TRUNCATE before every test.</text>
  </g>

  <!-- Card 1: Testcontainers code -->
  <g filter="url(#shadow)">
    <rect x="80" y="430" width="440" height="250" rx="16" fill="#161b22" stroke="#30363d"/>
  </g>
  <circle cx="106" cy="455" r="6" fill="#ff5f57"/>
  <circle cx="126" cy="455" r="6" fill="#febc2e"/>
  <circle cx="146" cy="455" r="6" fill="#28c840"/>
  <text x="168" y="461" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#8b949e">PostgresTest.java</text>
  <line x1="80" y1="480" x2="520" y2="480" stroke="#30363d"/>
  <rect x="116" y="566" width="386" height="100" rx="8" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="104" y="518" fill="#c9d1d9"><tspan fill="#ff7b72">new</tspan> <tspan fill="#d2a8ff">PostgreSQLContainer</tspan>(</text>
    <text x="128" y="552" fill="#a5d6ff">"postgres:17"<tspan fill="#c9d1d9">)</tspan></text>
    <text x="128" y="590" fill="#c9d1d9">.<tspan fill="#3fb950" font-weight="700">withTmpFs</tspan>(Map.of(</text>
    <text x="152" y="622" fill="#a5d6ff">"/var/lib/postgresql/data",</text>
    <text x="152" y="654" fill="#a5d6ff">"rw,size=512m"<tspan fill="#c9d1d9">));</tspan></text>
  </g>

  <!-- Arrow 1 -->
  <line x1="530" y1="555" x2="578" y2="555" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Card 2: data directory, disk vs RAM -->
  <g filter="url(#shadow)">
    <rect x="590" y="430" width="330" height="250" rx="16" fill="#161b22" stroke="#30363d"/>
  </g>
  <text x="614" y="461" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#d2a8ff">data directory</text>
  <line x1="590" y1="480" x2="920" y2="480" stroke="#30363d"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace">
    <text x="614" y="514" font-size="13" fill="#6e7681" letter-spacing="1.5">BEFORE</text>
    <rect x="614" y="526" width="282" height="46" rx="10" fill="#0d1117" stroke="#30363d"/>
    <rect x="630" y="540" width="26" height="18" rx="3" fill="none" stroke="#8b949e" stroke-width="2"/>
    <line x1="636" y1="552" x2="650" y2="552" stroke="#8b949e" stroke-width="2"/>
    <text x="670" y="555" font-size="18" fill="#8b949e">disk</text>
    <line x1="666" y1="549" x2="712" y2="549" stroke="#8b949e" stroke-width="2"/>
    <text x="880" y="555" text-anchor="end" font-size="14" fill="#6e7681">writes hit disk</text>

    <text x="614" y="604" font-size="13" fill="#3fb950" letter-spacing="1.5">AFTER</text>
    <rect x="614" y="616" width="282" height="46" rx="10" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-opacity="0.8"/>
    <rect x="630" y="630" width="30" height="18" rx="2" fill="none" stroke="#3fb950" stroke-width="2"/>
    <line x1="636" y1="648" x2="636" y2="653" stroke="#3fb950" stroke-width="2"/>
    <line x1="645" y1="648" x2="645" y2="653" stroke="#3fb950" stroke-width="2"/>
    <line x1="654" y1="648" x2="654" y2="653" stroke="#3fb950" stroke-width="2"/>
    <text x="674" y="645" font-size="18" font-weight="700" fill="#3fb950">RAM</text>
    <text x="880" y="645" text-anchor="end" font-size="14" fill="#3fb950" fill-opacity="0.85">tmpfs mount</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="930" y1="555" x2="978" y2="555" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- Card 3: result -->
  <g filter="url(#okglow)">
    <rect x="990" y="430" width="330" height="250" rx="16" fill="#0f1c14" stroke="#3fb950" stroke-opacity="0.8"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="1014" y="528" font-size="72" font-weight="800" fill="#3fb950" letter-spacing="-2">17%</text>
    <text x="1014" y="570" font-size="22" font-weight="600" fill="#f0f6fc">of its previous time</text>
  </g>
  <line x1="1014" y1="594" x2="1296" y2="594" stroke="#3fb950" stroke-opacity="0.3"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15">
    <text x="1014" y="628" fill="#7ee787">TRUNCATE 50+ tables</text>
    <text x="1014" y="654" fill="#8b949e">before every test</text>
  </g>

  <!-- Footer -->
  <text x="80" y="738" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681">A disposable database does not need durable storage.</text>
</svg>
