<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1400" height="788" viewBox="0 0 1400 788">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
    <radialGradient id="greenglow" cx="0.82" cy="0.68" r="0.45">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueglow" cx="0.12" cy="0.72" r="0.38">
      <stop offset="0" stop-color="#79c0ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#79c0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="okglow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#3fb950" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="788" fill="url(#bg)"/>
  <rect width="1400" height="788" fill="url(#dots)"/>
  <rect width="1400" height="788" fill="url(#blueglow)"/>
  <rect width="1400" height="788" fill="url(#greenglow)"/>

  <!-- Giant faint word -->
  <text x="1330" y="330" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="270" font-weight="700" fill="#ffffff" fill-opacity="0.045" letter-spacing="-8">:853</text>

  <!-- Title block -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="80" y="92" width="244" height="34" rx="17" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.5"/>
    <circle cx="102" cy="109" r="5" fill="#3fb950"/>
    <text x="116" y="115" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#56d364" letter-spacing="2">ANDROID · PRIVACY</text>

    <text x="78" y="222" font-size="76" font-weight="800" fill="#f0f6fc" letter-spacing="-2">You should use</text>
    <text x="78" y="306" font-size="76" font-weight="800" fill="#3fb950" letter-spacing="-2">Private DNS</text>
    <text x="82" y="358" font-size="24" fill="#8b949e">Block ads, trackers and malware on your whole phone, no VPN app needed.</text>
  </g>

  <!-- Card 1: phone lookups -->
  <g filter="url(#shadow)">
    <rect x="80" y="430" width="360" height="250" rx="16" fill="#161b22" stroke="#30363d"/>
  </g>
  <circle cx="106" cy="455" r="6" fill="#ff5f57"/>
  <circle cx="126" cy="455" r="6" fill="#febc2e"/>
  <circle cx="146" cy="455" r="6" fill="#28c840"/>
  <text x="168" y="461" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#8b949e">phone lookups</text>
  <line x1="80" y1="480" x2="440" y2="480" stroke="#30363d"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="104" y="522" fill="#c9d1d9"><tspan fill="#d2a8ff">A?</tspan> ads.doubleclick.net</text>
    <text x="104" y="562" fill="#c9d1d9"><tspan fill="#d2a8ff">A?</tspan> metrics.tracker.io</text>
    <text x="104" y="602" fill="#c9d1d9"><tspan fill="#d2a8ff">A?</tspan> wikipedia.org</text>
    <text x="104" y="642" fill="#c9d1d9"><tspan fill="#d2a8ff">A?</tspan> paypa1-login.com</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="450" y1="555" x2="508" y2="555" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Card 2: encrypted resolver -->
  <g filter="url(#shadow)">
    <rect x="520" y="430" width="380" height="250" rx="16" fill="#161b22" stroke="#30363d"/>
  </g>
  <!-- lock icon -->
  <rect x="544" y="452" width="16" height="13" rx="2.5" fill="#79c0ff"/>
  <path d="M547,452 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#79c0ff" stroke-width="2"/>
  <text x="572" y="461" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#79c0ff">Private DNS</text>
  <rect x="770" y="443" width="110" height="24" rx="12" fill="#79c0ff" fill-opacity="0.12" stroke="#79c0ff" stroke-opacity="0.5"/>
  <text x="825" y="460" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#79c0ff" letter-spacing="1">ENCRYPTED</text>
  <line x1="520" y1="480" x2="900" y2="480" stroke="#30363d"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="544" y="520" fill="#6e7681">// Settings → Private DNS</text>
    <text x="544" y="558" fill="#79c0ff">hostname:</text>
    <text x="568" y="592" fill="#a5d6ff">abc123.dns.nextdns.io</text>
    <text x="544" y="634" fill="#79c0ff">protocol: <tspan fill="#c9d1d9">TLS</tspan> <tspan fill="#6e7681">port</tspan> <tspan fill="#ffa657">853</tspan></text>
  </g>

  <!-- Arrow 2 -->
  <line x1="910" y1="555" x2="968" y2="555" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- Card 3: answers -->
  <g filter="url(#okglow)">
    <rect x="980" y="430" width="340" height="250" rx="16" fill="#0f1a13" stroke="#3fb950" stroke-opacity="0.8"/>
  </g>
  <text x="1004" y="461" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#56d364">filtered answers</text>
  <line x1="980" y1="480" x2="1320" y2="480" stroke="#3fb950" stroke-opacity="0.3"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="1004" y="522" fill="#f85149">✗ <tspan fill="#8b949e" text-decoration="line-through">ads.doubleclick.net</tspan></text>
    <text x="1004" y="562" fill="#f85149">✗ <tspan fill="#8b949e" text-decoration="line-through">metrics.tracker.io</tspan></text>
    <text x="1004" y="602" fill="#3fb950">✓ <tspan fill="#c9d1d9">wikipedia.org</tspan></text>
    <text x="1004" y="642" fill="#f85149">✗ <tspan fill="#8b949e" text-decoration="line-through">paypa1-login.com</tspan></text>
  </g>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" letter-spacing="1" text-anchor="end">
    <text x="1300" y="521" fill="#f85149" fill-opacity="0.8">AD</text>
    <text x="1300" y="561" fill="#f85149" fill-opacity="0.8">TRACKER</text>
    <text x="1300" y="601" fill="#3fb950" fill-opacity="0.8">OK</text>
    <text x="1300" y="641" fill="#f85149" fill-opacity="0.8">PHISHING</text>
  </g>

  <!-- Footer -->
  <text x="80" y="738" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681">One Android setting, set once, filters every lookup your phone makes.</text>
</svg>
